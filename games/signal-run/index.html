<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#08100f">
    <title>Signal Run</title>
    <meta name="description" content="A small 3D lane runner built with Three.js.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="game.css">
  </head>
  <body>
    <main class="game-shell">
      <canvas id="game-canvas" aria-label="Signal Run 3D game"></canvas>

      <header class="game-header">
        <a class="back-link" href="../" aria-label="Back to all games">
          <span aria-hidden="true">&larr;</span>
          <span>Games</span>
        </a>
        <div class="game-title">
          <span class="game-title__mark" aria-hidden="true"></span>
          <span>Signal Run</span>
        </div>
        <button class="icon-button" id="pause-button" type="button" aria-label="Pause game" title="Pause">
          <span aria-hidden="true">&#8545;</span>
        </button>
      </header>

      <section class="hud" aria-label="Game status">
        <div class="hud__item">
          <span class="hud__label">Score</span>
          <strong id="score">00000</strong>
        </div>
        <div class="hud__item hud__item--right">
          <span class="hud__label">Best</span>
          <strong id="best-score">00000</strong>
        </div>
      </section>

      <section class="overlay is-visible" id="start-overlay" aria-labelledby="start-title">
        <p class="overline">Three lanes. One signal.</p>
        <h1 id="start-title">Signal Run</h1>
        <p>Collect energy cores and dodge the barriers.</p>
        <button class="primary-button" id="start-button" type="button">Start run</button>
        <p class="control-hint"><kbd>A</kbd> <kbd>D</kbd> or arrow keys to steer</p>
      </section>

      <section class="overlay" id="pause-overlay" aria-labelledby="pause-title" aria-hidden="true">
        <p class="overline">Run suspended</p>
        <h2 id="pause-title">Paused</h2>
        <button class="primary-button" id="resume-button" type="button">Resume</button>
      </section>

      <section class="overlay" id="game-over-overlay" aria-labelledby="game-over-title" aria-hidden="true">
        <p class="overline">Transmission ended</p>
        <h2 id="game-over-title">Run over</h2>
        <p>You scored <strong id="final-score">0</strong></p>
        <button class="primary-button" id="restart-button" type="button">Run again</button>
      </section>

      <div class="touch-controls" aria-label="Touch controls">
        <button id="move-left" type="button" aria-label="Move left">
          <span aria-hidden="true">&larr;</span>
        </button>
        <button id="move-right" type="button" aria-label="Move right">
          <span aria-hidden="true">&rarr;</span>
        </button>
      </div>

      <div class="loading-message" id="loading-message" role="status">Loading 3D engine...</div>
    </main>

    <script type="module" src="game.js"></script>
  </body>
</html>
