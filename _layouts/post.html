---
layout: default
---

<article class="post">
  <header class="post__header">
    <a class="back-link" href="{{ "/" | relative_url }}">All posts</a>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    <h1>{{ page.title }}</h1>
    {% if page.description %}
      <p>{{ page.description }}</p>
    {% endif %}
    {% if page.tags %}
      <ul class="tag-list" aria-label="Tags">
        {% for tag in page.tags %}
          <li>{{ tag }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  </header>

  {% if page.cover %}
    <img class="post__cover" src="{{ page.url | append: page.cover | relative_url }}" alt="{{ page.cover_alt | default: page.title | escape }}">
  {% endif %}

  <div class="post__content">
    {{ content }}
  </div>
</article>
